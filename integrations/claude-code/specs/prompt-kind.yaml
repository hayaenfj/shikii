# AI 自身の考え方 1(考える前): この依頼を受けた AI は結局何をすることになるか。Claude Code / Codex の UserPromptSubmit で `shikii hook user-prompt-submit` が聞く。
# 正解は結果から自動で付く: 次の依頼が来た時(無ければターンの終わり)に作業ツリーのハッシュが変わっていれば edit、変わっていなければ !edit(部分ラベル、重み 0.7)。
# 迷った時は、直前のアシスタントの発言(Stop で hook が控えたもの)を足して聞き直す。
id: prompt-kind
version: 2
type: choice

question: |
  What will the AI agent most likely end up doing in response to `request`, whether the task involves writing, research, business support or software?

options:
  - id: edit
    description: editing, adding, fixing or deleting local project files (documents, spreadsheets, images, code or configuration)
  - id: explain
    description: answering a question or explaining something, without touching files
  - id: investigate
    description: researching or reading documents, data, code or the web to report findings or options, without editing files
  - id: run
    description: running commands or tools, performing checks and reporting the result, without editing files
  - id: decide
    description: the user is replying to a proposal or choosing between options the agent offered

state:
  template: |
    request: {{ request }}
  required: [request]
  # 迷った時だけ: 直前のアシスタントの発言(Stop の hook が控えたもの)を足して聞き直す(別のハッシュ・別の線)。短い返事(「yes please」「go ahead」)はこれで決まる
  context: |
    previous assistant turn: {{ previous }}
    request: {{ request }}

policy:
  # 2026-10-23 の決定: 標準は TypeSafe の Jev(鍵 TYPESAFE_API_KEY があれば hosted へ送る)、手元の標準は Ternary-Bonsai-27B。
  # 依頼・返答・教訓の文を Jev へ送ることは本人が許可した。本文は手元の記録にも残る
  send_to: [hosted, local]
  pii: false

thresholds:
  act: 0.75
  ask: 0.60

eval:
  min_n: 50
# 画面の表示用の訳(モデルには送らない。較正の鍵にも入らない)
display:
  ja:
    title: 依頼の種類
    question: この依頼を受けた AI は、結局どんな作業をすることになりそうか？
    options:
      edit: ファイルを変える
      explain: 説明する(ファイルは触らない)
      investigate: 調べて報告する
      run: 実行して結果を報告する
      decide: 提案への返事・選択
