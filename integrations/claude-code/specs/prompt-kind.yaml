# The AI's own thinking, 1 (before it thinks): what will the AI that receives this request end up doing? `shikii hook user-prompt-submit` asks this at UserPromptSubmit in Claude Code / Codex.
# The truth is set automatically from the outcome: when the next request arrives (or at the end of the turn if none), edit if the working tree's hash changed, !edit if not (a partial label, weight 0.7).
# When unsure, it asks again with the assistant's previous message added (the one the hook saved at Stop).
id: prompt-kind
version: 2
type: choice

question: |
  What will the AI agent most likely end up doing in response to `request`, whether the task involves writing, research, business support or software?

options:
  - id: edit
    description: editing, adding, fixing or deleting local project files (documents, spreadsheets, images, code or configuration)
  - id: explain
    description: answering a question or explaining something, without touching files
  - id: investigate
    description: researching or reading documents, data, code or the web to report findings or options, without editing files
  - id: run
    description: running commands or tools, performing checks and reporting the result, without editing files
  - id: decide
    description: the user is replying to a proposal or choosing between options the agent offered

state:
  template: |
    request: {{ request }}
  required: [request]
  # Only when unsure: ask again with the assistant's previous message added (the one the Stop hook saved) (a separate hash and a separate line). Short replies ("yes please", "go ahead") are decided by this
  context: |
    previous assistant turn: {{ previous }}
    request: {{ request }}

policy:
  # Decision of 2026-10-23: the default is TypeSafe's Jev (sent to hosted when the key TYPESAFE_API_KEY is set); the local default is Ternary-Bonsai-27B.
  # The owner allowed sending request, reply and lesson text to Jev. The text is also kept in the local records
  send_to: [hosted, local]
  pii: false

thresholds:
  act: 0.75
  ask: 0.60

eval:
  min_n: 50
# Translations for the page (not sent to the model, and not part of the calibration key)
display:
  ja:
    title: 依頼の種類
    question: この依頼を受けた AI は、結局どんな作業をすることになりそうか？
    options:
      edit: ファイルを変える
      explain: 説明する(ファイルは触らない)
      investigate: 調べて報告する
      run: 実行して結果を報告する
      decide: 提案への返事・選択
