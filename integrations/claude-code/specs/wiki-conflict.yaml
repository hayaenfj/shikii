# Wiki conflict: does a new lesson on the same topic disagree with an existing lesson (would following it mean breaking the other one)?
# reflect place asks this only for the top pages among the candidate places. Until a line is drawn, it is passed to the agent as a suspicion, and the agent reads the text and decides.
# The truth is set automatically from the outcome: "yes" if submit replaced that page (weight 1), "no" if it added to the same page without replacing it (partial, weight 0.5). The person does not answer.
id: wiki-conflict
version: 1
type: noul
question: "Two lessons in a project wiki are about the same topic. Do they give conflicting guidance, so that following one would mean breaking the other in the same situation? Answer no if the new lesson merely adds detail, rephrases, or extends the existing one without contradicting it."
state:
  template: |
    existing lesson: {{ lesson }}
    new lesson: {{ new_lesson }}
  required: [lesson, new_lesson]
policy:
  # Decision of 2026-10-23: the default is TypeSafe's Jev (sent to hosted when the key TYPESAFE_API_KEY is set); the local default is Ternary-Bonsai-27B.
  # The owner allowed sending request, reply and lesson text to Jev. The text is also kept in the local records
  send_to: [hosted, local]
  pii: false
thresholds:
  act: 0.75
  ask: 0.55
eval:
  min_n: 50
display:
  ja:
    title: wiki の矛盾
    question: 新しい教訓は、同じ話題の既存の教訓と食い違うか？（片方に従うと、もう片方を破ることになるか）
    options:
      "yes": 食い違う
      "no": 食い違わない（足す・言い換え）
