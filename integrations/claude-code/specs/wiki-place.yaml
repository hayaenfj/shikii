# Wiki place: is a new lesson on the same topic as an existing page (if so, add to or replace that page; if not, a new page)?
# reflect place asks this by pairing the lesson the agent wrote with each live page, one at a time.
# The truth is set automatically from the outcome: "yes" if at submit the agent added to or replaced that page (weight 1), "no" if it chose a different place (partial, weight 0.5). The person does not answer.
id: wiki-place
version: 1
type: noul
question: "A new lesson is being added to a project wiki. Is the new lesson about the same topic as the existing page, so that it should be merged into that page (as an update or addition) rather than filed as a separate new page? Answer no if they are about different topics, even if some words overlap."
state:
  template: |
    existing page title: {{ title }}
    existing page lesson: {{ lesson }}
    existing page applies to: {{ applies_to }}
    new lesson: {{ new_lesson }}
    new lesson applies to: {{ new_applies }}
  required: [title, lesson, applies_to, new_lesson, new_applies]
policy:
  # Decision of 2026-10-23: the default is TypeSafe's Jev (sent to hosted when the key TYPESAFE_API_KEY is set); the local default is Ternary-Bonsai-27B.
  # The owner allowed sending request, reply and lesson text to Jev. The text is also kept in the local records
  send_to: [hosted, local]
  pii: false
thresholds:
  act: 0.75
  ask: 0.55
eval:
  min_n: 50
display:
  ja:
    title: wiki の差し込み先
    question: 新しい教訓は、この既存の記事と同じ話題か？（同じなら記事へ足す・置き換える。違えば新しい記事）
    options:
      "yes": 同じ話題（この記事へ）
      "no": 別の話題
