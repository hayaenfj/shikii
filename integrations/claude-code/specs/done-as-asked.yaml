# AI 自身の考え方 4(考え終わった後): 頼まれたことを終えたか。ターンの終わり(Stop)に `shikii hook stop` が、
# 依頼(UserPromptSubmit で控えたもの)・ターンの間に変わったファイルの一覧・最後の返答を揃えて 1 回聞く。依頼の控えが無い時は聞かない。同じ依頼については 1 回だけ。
# 普段は会話と結果から AI が仮採点し、人は抜き取りと保留を画面(:8096、`shikii serve --store ~/.shikii/agent --port 8096`)で答える: 「もう一度言い直すことが残っていなかったか」。
# 線が引けたら、確信して「終えていない」(discard)の時だけ端末に 1 行。エージェントには渡さない(Stop で文脈を返すと会話が続く。続けるかは人が決める)。
id: done-as-asked
version: 1
type: noul

question: |
  The user asked a coding agent for `request`. The agent ended its turn with `summary`; these files changed during the turn: `files`. Did the agent finish what was asked, so that the user has nothing to repeat, correct or ask about again? An honest "I could not do X because Y" and a direct answer to a question both count as finished. Stopping half-way, asking a question the request already answered, or saying it is done without doing it do not.

state:
  template: |
    request: {{ request }}
    files changed during the turn:
    {{ files }}
    agent's closing message: {{ summary }}
  required: [request, summary]

policy:
  send_to: [local]    # 依頼と返答の文は外に出さない
  pii: true

thresholds:
  act: 0.75
  ask: 0.55

eval:
  min_n: 50

display:
  ja:
    title: 頼まれたことを終えたか
    question: このターンで AI は人の依頼を終えたか(人がもう一度言い直すことは残っていないか)？
    options:
      "yes": 終えた
      "no": 終えていない
