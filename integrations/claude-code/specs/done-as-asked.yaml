# The AI's own thinking, 4 (after it has finished): did it finish what was asked? At the end of the turn (Stop), `shikii hook stop`
# asks once, with the request (saved at UserPromptSubmit), the list of files changed during the turn and the final reply. It does not ask when no saved request exists. It asks only once per request.
# Normally the AI scores it provisionally from the conversation and the outcome, and the person answers samples and held items on the page (:8096, `shikii serve --store ~/.shikii/agent --port 8096`): "was there nothing left to say again".
# The truth is also set automatically from the outcome: if the person's next message restates the same request (text similarity 0.6 or more), "no" (weight 1); if it is clearly a different request (0.2 or less), "yes" (weight 0.5). Short replies and the middle range get no label.
# Once a line is drawn, it prints one line to the terminal only when it is confident the request was "not finished" (discard). It does not pass this to the agent (returning context at Stop continues the conversation; the person decides whether to continue).
id: done-as-asked
version: 2
type: noul

question: |
  The user asked an AI agent for `request`. The agent ended its turn with `summary`; available local file changes are `files`. Did the agent finish the requested answer, draft, investigation or action, so that the user has nothing to repeat, correct or ask about again? An honest "I could not do X because Y" and a direct answer to a question both count as finished. Stopping half-way, asking a question the request already answered, or saying it is done without doing it do not. File changes are supporting evidence when available; an empty list alone does not mean the task is unfinished.

state:
  template: |
    request: {{ request }}
    observed local file changes (when available):
    {{ files }}
    agent's closing message: {{ summary }}
  required: [request, summary]

policy:
  # Decision of 2026-10-23: the default is TypeSafe's Jev (sent to hosted when the key TYPESAFE_API_KEY is set); the local default is Ternary-Bonsai-27B.
  # The owner allowed sending request, reply and lesson text to Jev. The text is also kept in the local records
  send_to: [hosted, local]
  pii: false

thresholds:
  act: 0.75
  ask: 0.55

eval:
  min_n: 50

display:
  ja:
    title: 頼まれたことを終えたか
    question: このターンで AI は人の依頼を終えたか(人がもう一度言い直すことは残っていないか)？
    options:
      "yes": 終えた
      "no": 終えていない
  en:
    title: Did it finish what was asked?
    question: In this turn, did the AI finish your request (is there nothing you have to say again)?
    options:
      "yes": Finished
      "no": Not finished
