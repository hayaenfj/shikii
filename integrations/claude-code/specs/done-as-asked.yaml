# AI 自身の考え方 4(考え終わった後): 頼まれたことを終えたか。ターンの終わり(Stop)に `shikii hook stop` が、
# 依頼(UserPromptSubmit で控えたもの)・ターンの間に変わったファイルの一覧・最後の返答を揃えて 1 回聞く。依頼の控えが無い時は聞かない。同じ依頼については 1 回だけ。
# 普段は会話と結果から AI が仮採点し、人は抜き取りと保留を画面(:8096、`shikii serve --store ~/.shikii/agent --port 8096`)で答える: 「もう一度言い直すことが残っていなかったか」。
# 正解は結果からも自動で付く: 次の人の発言が同じ依頼の言い直し(文字の似方 0.6 以上)なら「いいえ」(重み 1)、はっきり別の依頼(0.2 以下)なら「はい」(重み 0.5)。短い返事と中間は付けない。
# 線が引けたら、確信して「終えていない」(discard)の時だけ端末に 1 行。エージェントには渡さない(Stop で文脈を返すと会話が続く。続けるかは人が決める)。
id: done-as-asked
version: 2
type: noul

question: |
  The user asked an AI agent for `request`. The agent ended its turn with `summary`; available local file changes are `files`. Did the agent finish the requested answer, draft, investigation or action, so that the user has nothing to repeat, correct or ask about again? An honest "I could not do X because Y" and a direct answer to a question both count as finished. Stopping half-way, asking a question the request already answered, or saying it is done without doing it do not. File changes are supporting evidence when available; an empty list alone does not mean the task is unfinished.

state:
  template: |
    request: {{ request }}
    observed local file changes (when available):
    {{ files }}
    agent's closing message: {{ summary }}
  required: [request, summary]

policy:
  # 2026-10-23 の決定: 標準は TypeSafe の Jev(鍵 TYPESAFE_API_KEY があれば hosted へ送る)、手元の標準は Ternary-Bonsai-27B。
  # 依頼・返答・教訓の文を Jev へ送ることは本人が許可した。本文は手元の記録にも残る
  send_to: [hosted, local]
  pii: false

thresholds:
  act: 0.75
  ask: 0.55

eval:
  min_n: 50

display:
  ja:
    title: 頼まれたことを終えたか
    question: このターンで AI は人の依頼を終えたか(人がもう一度言い直すことは残っていないか)？
    options:
      "yes": 終えた
      "no": 終えていない
