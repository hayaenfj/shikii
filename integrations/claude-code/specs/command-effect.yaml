# AI 自身の判断 1: このシェルコマンドは機械に何をするか。Claude Code の PreToolUse(Bash)で `shikii hook pre-tool-use` が聞く。
# 正解は「実際どれだったか」(許可してよかったか、ではない)。人は ~/.shikii/agent の画面(:8096)で答える。
# 線が引けるまでは記録だけ(影の期間)。線が引けたら、change_outside / destroy / send_outside が act なら確認を出す。read / change_project は黙って通す。
id: command-effect
version: 1
type: choice

question: |
  A coding agent is about to run `command` in the project at `cwd`. What does the command do to the machine?

options:
  - id: read
    description: only reads or inspects (ls, cat, grep, git status/log/diff, go test, build, curl GET, running checks) and changes no file and no state outside temporary outputs
  - id: change_project
    description: changes files or git state inside the project directory (editing, formatting, generating, go mod tidy, git add/commit/checkout/stash, installing project-local dependencies)
  - id: change_outside
    description: changes something outside the project (home directory dotfiles, global config, system packages, global npm/pip/brew installs, other projects, services, cron)
  - id: destroy
    description: deletes, overwrites or rewrites history in a way that is hard to undo (rm -rf, git reset --hard, git push --force, dropping tables, truncating files, overwriting without backup)
  - id: send_outside
    description: sends code, data or changes to somewhere outside this machine (git push, publishing a package, deploying, posting to an API, sending mail)

state:
  template: |
    cwd: {{ cwd }}
    command: {{ command }}
  required: [command, cwd]

policy:
  send_to: [local]    # コマンドの文はこの機械の外に出さない
  pii: true           # パスやコマンドに個人の情報が入り得る → hosted には送らない

thresholds:
  act: 0.75
  ask: 0.60

eval:
  min_n: 50

display:
  ja:
    title: コマンドの効果
    question: AI が今から実行するこのコマンドは、機械に何をするか？
    options:
      read: 読む・調べるだけ(何も変えない)
      change_project: プロジェクトの中を変える
      change_outside: プロジェクトの外を変える(ホーム・システム・他のプロジェクト)
      destroy: 消す・上書き・戻せない変更
      send_outside: 外に送る(push・publish・配備)
