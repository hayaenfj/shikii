<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="shikiiは、あなたのプロジェクトに合わせて育てる。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1424"/><stop offset="1" stop-color="#050810"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5B700"/><stop offset="1" stop-color="#FFD54F"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4B5B82" stop-opacity="0"/><stop offset="1" stop-color="#4B5B82" stop-opacity="0.9"/></linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="600"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <text x="1180" y="540" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="640" fill="#FFFFFF" fill-opacity="0.04">閾</text>
  <g font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif">
    <text x="110" y="250" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="150" font-weight="700" letter-spacing="-6" fill="#F2F5FA">shikii</text>
    <text x="118" y="310" font-size="26" letter-spacing="5" fill="#8FA3C8">閾 · エージェントのための、プロジェクトの記憶</text>
    <text x="118" y="400" font-size="38" font-weight="500" fill="#F2F5FA">プロジェクトの経験を、次の仕事へ。</text>
    <text x="118" y="456" font-size="38" font-weight="700" fill="#F5B700">shikiiは、あなたのプロジェクトに合わせて育てる。</text>
    <text x="118" y="520" font-size="22" fill="#5B6B8C">覚える → 二度言わせない → 手順を踏む → 跡を残す → 任せる</text>
  </g>
  <rect x="1060" y="140" width="524" height="40" rx="20.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1080" y="140" width="250" height="40" rx="20.0" fill="url(#fade)"/>
  <rect x="1330" y="140" width="220" height="40" rx="20.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1316" y="166.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="19" fill="#F2F5FA" fill-opacity="0.92">前にも言ったよね</text>
  <text x="1344" y="166.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="19" font-weight="500" fill="#FFD54F">覚えている</text>
  <rect x="1060" y="210" width="524" height="40" rx="20.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1080" y="210" width="250" height="40" rx="20.0" fill="url(#fade)"/>
  <rect x="1330" y="210" width="220" height="40" rx="20.0" fill="url(#gold)" fill-opacity="0.95"/>
  <text x="1316" y="236.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="19" fill="#F2F5FA" fill-opacity="0.92">また同じミス</text>
  <text x="1344" y="236.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="19" font-weight="700" fill="#1A1300">止めて直させる</text>
  <rect x="1060" y="280" width="524" height="40" rx="20.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1080" y="280" width="250" height="40" rx="20.0" fill="url(#fade)"/>
  <rect x="1330" y="280" width="220" height="40" rx="20.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1316" y="306.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="19" fill="#F2F5FA" fill-opacity="0.92">いきなり作業</text>
  <text x="1344" y="306.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="19" font-weight="500" fill="#FFD54F">先に整理する</text>
  <rect x="1060" y="350" width="524" height="40" rx="20.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1080" y="350" width="250" height="40" rx="20.0" fill="url(#fade)"/>
  <rect x="1330" y="350" width="220" height="40" rx="20.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1316" y="376.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="19" fill="#F2F5FA" fill-opacity="0.92">報告はどこ？</text>
  <text x="1344" y="376.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="19" font-weight="500" fill="#FFD54F">handoff/ にある</text>
  <rect x="1060" y="420" width="524" height="40" rx="20.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1080" y="420" width="250" height="40" rx="20.0" fill="url(#fade)"/>
  <rect x="1330" y="420" width="220" height="40" rx="20.0" fill="url(#gold)" fill-opacity="0.95"/>
  <text x="1316" y="446.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="19" fill="#F2F5FA" fill-opacity="0.92">たぶん、0.9</text>
  <text x="1344" y="446.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="19" font-weight="700" fill="#1A1300">ask → act</text>
  <line x1="1330" y1="114" x2="1330" y2="482" stroke="#F5B700" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="17"><text x="1060" y="106" fill="#8FA3C8">ターン →</text><text x="1330" y="100" text-anchor="middle" fill="#F5B700" font-weight="700">閾</text></g>
</svg>
