<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="shikiiは、あなたのプロジェクトに合わせて育てる。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1424"/><stop offset="1" stop-color="#050810"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5B700"/><stop offset="1" stop-color="#FFD54F"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4B5B82" stop-opacity="0"/><stop offset="1" stop-color="#4B5B82" stop-opacity="0.9"/></linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="600"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <text x="1180" y="540" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="640" fill="#FFFFFF" fill-opacity="0.04">閾</text>
  <g font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif">
    <text x="110" y="250" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="150" font-weight="700" letter-spacing="-6" fill="#F2F5FA">shikii</text>
    <text x="118" y="310" font-size="26" letter-spacing="5" fill="#8FA3C8">閾 · エージェントのための、プロジェクトの記憶</text>
    <text x="118" y="400" font-size="38" font-weight="500" fill="#F2F5FA">エージェントは、毎回まっさらから始まる。</text>
    <text x="118" y="456" font-size="38" font-weight="700" fill="#F5B700">shikiiは、あなたのプロジェクトに合わせて育てる。</text>
    <text x="118" y="520" font-size="22" fill="#5B6B8C">覚える → 二度言わせない → 手順を踏む → 跡を残す → 任せる</text>
  </g>
  <rect x="1060" y="130" width="524" height="34" rx="17.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1070" y="130" width="230" height="34" rx="17.0" fill="url(#fade)"/>
  <rect x="1300" y="130" width="230" height="34" rx="17.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1286" y="152.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" fill="#F2F5FA" fill-opacity="0.92">READMEを直して</text>
  <text x="1314" y="152.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" font-weight="500" fill="#FFD54F">教訓が2件届く</text>
  <rect x="1060" y="188" width="524" height="34" rx="17.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1100" y="188" width="200" height="34" rx="17.0" fill="url(#fade)"/>
  <rect x="1300" y="188" width="248" height="34" rx="17.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1286" y="210.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" fill="#F2F5FA" fill-opacity="0.92">監査して</text>
  <text x="1314" y="210.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" font-weight="500" fill="#FFD54F">報告は handoff/ へ</text>
  <rect x="1060" y="246" width="524" height="34" rx="17.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1064" y="246" width="236" height="34" rx="17.0" fill="url(#fade)"/>
  <rect x="1300" y="246" width="268" height="34" rx="17.0" fill="url(#gold)" fill-opacity="0.95"/>
  <text x="1286" y="268.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" fill="#F2F5FA" fill-opacity="0.92">Makefileを直して</text>
  <text x="1314" y="268.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" font-weight="700" fill="#1A1300">検査で止まり、直す</text>
  <rect x="1060" y="304" width="524" height="34" rx="17.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1110" y="304" width="190" height="34" rx="17.0" fill="url(#fade)"/>
  <rect x="1300" y="304" width="236" height="34" rx="17.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1286" y="326.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" fill="#F2F5FA" fill-opacity="0.92">リリースして</text>
  <text x="1314" y="326.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" font-weight="500" fill="#FFD54F">整理 ✓ 振り返り ✓</text>
  <rect x="1060" y="362" width="524" height="34" rx="17.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1086" y="362" width="214" height="34" rx="17.0" fill="url(#fade)"/>
  <rect x="1300" y="362" width="270" height="34" rx="17.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1286" y="384.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" fill="#F2F5FA" fill-opacity="0.92">ヒーロー画像を</text>
  <text x="1314" y="384.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" font-weight="500" fill="#FFD54F">使わない語を守る</text>
  <rect x="1060" y="420" width="524" height="34" rx="17.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1120" y="420" width="180" height="34" rx="17.0" fill="url(#fade)"/>
  <rect x="1300" y="420" width="200" height="34" rx="17.0" fill="url(#gold)" fill-opacity="0.95"/>
  <text x="1286" y="442.8" text-anchor="end" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" fill="#F2F5FA" fill-opacity="0.92">前と同じ案件？</text>
  <text x="1314" y="442.8" font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="16" font-weight="700" fill="#1A1300">ask → act</text>
  <line x1="1300" y1="104" x2="1300" y2="476" stroke="#F5B700" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="'Hiragino Sans','Noto Sans JP',Inter,sans-serif" font-size="17"><text x="1060" y="96" fill="#8FA3C8">ターン →</text><text x="1300" y="90" text-anchor="middle" fill="#F5B700" font-weight="700">閾</text></g>
</svg>
