<svg xmlns="http://www.w3.org/2000/svg" viewBox="1030 60 570 440" width="1140" height="880" role="img" aria-label="shikii fits it to your project.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1424"/><stop offset="1" stop-color="#050810"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5B700"/><stop offset="1" stop-color="#FFD54F"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4B5B82" stop-opacity="0"/><stop offset="1" stop-color="#4B5B82" stop-opacity="0.9"/></linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="600"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <text x="1180" y="540" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="640" fill="#FFFFFF" fill-opacity="0.04">閾</text>
  <g font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="110" y="250" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="150" font-weight="700" letter-spacing="-6" fill="#F2F5FA">shikii</text>
    <text x="118" y="310" font-size="26" letter-spacing="5" fill="#8FA3C8">閾 · PROJECT MEMORY FOR AGENTS</text>
    <text x="118" y="400" font-size="40" font-weight="500" fill="#F2F5FA">Bring project experience to the next task.</text>
    <text x="118" y="456" font-size="40" font-weight="700" fill="#F5B700">shikii fits it to your project.</text>
    <text x="118" y="520" font-size="22" fill="#5B6B8C">remember → never twice → routine → trail → delegate</text>
  </g>
  <rect x="1060" y="140" width="524" height="40" rx="20.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1070" y="140" width="290" height="40" rx="20.0" fill="url(#fade)"/>
  <rect x="1360" y="140" width="130" height="40" rx="20.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1346" y="166.5" text-anchor="end" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#F2F5FA" fill-opacity="0.92">Remembers what you said</text>
  <text x="1374" y="166.5" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#FFD54F">wiki/</text>
  <rect x="1060" y="210" width="524" height="40" rx="20.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1070" y="210" width="290" height="40" rx="20.0" fill="url(#fade)"/>
  <rect x="1360" y="210" width="130" height="40" rx="20.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1346" y="236.5" text-anchor="end" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#F2F5FA" fill-opacity="0.92">Never needs telling twice</text>
  <text x="1374" y="236.5" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#FFD54F">guards/</text>
  <rect x="1060" y="280" width="524" height="40" rx="20.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1070" y="280" width="290" height="40" rx="20.0" fill="url(#fade)"/>
  <rect x="1360" y="280" width="200" height="40" rx="20.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1346" y="306.5" text-anchor="end" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#F2F5FA" fill-opacity="0.92">Follows the routine</text>
  <text x="1374" y="306.5" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#FFD54F">plan · reflect</text>
  <rect x="1060" y="350" width="524" height="40" rx="20.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1070" y="350" width="290" height="40" rx="20.0" fill="url(#fade)"/>
  <rect x="1360" y="350" width="130" height="40" rx="20.0" fill="url(#gold)" fill-opacity="0.32"/>
  <text x="1346" y="376.5" text-anchor="end" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#F2F5FA" fill-opacity="0.92">Leaves a trail</text>
  <text x="1374" y="376.5" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#FFD54F">handoff/</text>
  <rect x="1060" y="420" width="524" height="40" rx="20.0" fill="#2A3147" fill-opacity="0.28"/>
  <rect x="1070" y="420" width="290" height="40" rx="20.0" fill="url(#fade)"/>
  <rect x="1360" y="420" width="170" height="40" rx="20.0" fill="url(#gold)" fill-opacity="0.95"/>
  <text x="1346" y="446.5" text-anchor="end" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" fill="#F2F5FA" fill-opacity="0.92">Earns room to act alone</text>
  <text x="1374" y="446.5" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1A1300">ask → act</text>
  <line x1="1360" y1="114" x2="1360" y2="482" stroke="#F5B700" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17"><text x="1060" y="106" fill="#8FA3C8">turns →</text><text x="1360" y="100" text-anchor="middle" fill="#F5B700" font-weight="700">threshold</text></g>
</svg>
