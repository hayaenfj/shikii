<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc" lang="en" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif">
<title id="title">Every turn adds to what the project knows.</title><desc id="desc">Read first, keep a trail, reflect at the end. A skipped step stops the turn.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#080f1b"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#7d93af" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="630" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-size="30" font-weight="700" fill="#f4c76a">shikii</text>
<text x="48" y="126" font-size="38" font-weight="700" fill="#f0f5fc">Every turn adds to what the project knows.</text>
<text x="48" y="170" font-size="21" font-weight="400" fill="#b3c3d9">Read first, keep a trail, reflect at the end. A skipped step stops the turn.</text>
<rect x="48" y="216" width="336" height="260" rx="16" fill="#152236" stroke="#2b405b"/>
<text x="72" y="259" font-size="20" font-weight="700" fill="#f4c76a">01</text>
<text x="72" y="304" font-size="24" font-weight="700" fill="#f0f5fc">Read before work</text>
<text x="72" y="345" font-size="19" font-weight="400" fill="#b3c3d9">Search the wiki first</text>
<text x="72" y="382.5" font-size="18" font-weight="400" fill="#a8bad3">Similar lessons arrive</text>
<path d="M 390 324 H 424" fill="none" stroke="#7d93af" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="432" y="216" width="336" height="260" rx="16" fill="#152236" stroke="#2b405b"/>
<text x="456" y="259" font-size="20" font-weight="700" fill="#83d8b0">02</text>
<text x="456" y="304" font-size="24" font-weight="700" fill="#f0f5fc">Keep a trail</text>
<text x="456" y="345" font-size="19" font-weight="400" fill="#b3c3d9">Reports go to work</text>
<text x="456" y="373.5" font-size="19" font-weight="400" fill="#b3c3d9">records</text>
<text x="456" y="411.0" font-size="18" font-weight="400" fill="#a8bad3">Not into the repository</text>
<path d="M 774 324 H 808" fill="none" stroke="#7d93af" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="816" y="216" width="336" height="260" rx="16" fill="#152236" stroke="#2b405b"/>
<text x="840" y="259" font-size="20" font-weight="700" fill="#8db8f4">03</text>
<text x="840" y="304" font-size="24" font-weight="700" fill="#f0f5fc">Reflect at the end</text>
<text x="840" y="345" font-size="19" font-weight="400" fill="#b3c3d9">Save what was learned</text>
<text x="840" y="382.5" font-size="18" font-weight="400" fill="#a8bad3">Guards check corrections</text>
<path d="M 984 484 V 530 H 216 V 484" fill="none" stroke="#7d93af" stroke-width="2" marker-end="url(#arrow)"/>
<text x="236" y="560" font-size="18" font-weight="400" fill="#83d8b0">Delivered with the next request</text>
<text x="48" y="608" font-size="19" font-weight="400" fill="#a8bad3">Checkable corrections become guards. Truths come from results; people check samples and undecided cases.</text>
</svg>
