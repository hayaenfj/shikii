<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc" lang="en" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Segoe UI', sans-serif">
<title id="title">Turn a correction into the next action.</title><desc id="desc">Your usual agent connects sourced lessons to decisions and observed results.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#080f1b"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#7d93af" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="630" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-size="30" font-weight="700" fill="#f4c76a">shikii</text>
<text x="48" y="126" font-size="38" font-weight="700" fill="#f0f5fc">Turn a correction into the next action.</text>
<text x="48" y="170" font-size="21" font-weight="400" fill="#b3c3d9">Your usual agent connects sourced lessons to decisions and observed results.</text>
<rect x="48" y="216" width="336" height="260" rx="16" fill="#152236" stroke="#2b405b"/>
<text x="72" y="259" font-size="20" font-weight="700" fill="#f4c76a">01</text>
<text x="72" y="304" font-size="24" font-weight="700" fill="#f0f5fc">Ask and correct</text>
<text x="72" y="345" font-size="19" font-weight="400" fill="#b3c3d9">“There is still</text>
<text x="72" y="373.5" font-size="19" font-weight="400" fill="#b3c3d9">English left.”</text>
<text x="72" y="411.0" font-size="18" font-weight="400" fill="#a8bad3">Keep the request, reply</text>
<text x="72" y="438.0" font-size="18" font-weight="400" fill="#a8bad3">and next message</text>
<path d="M 390 324 H 424" fill="none" stroke="#7d93af" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="432" y="216" width="336" height="260" rx="16" fill="#152236" stroke="#2b405b"/>
<text x="456" y="259" font-size="20" font-weight="700" fill="#83d8b0">02</text>
<text x="456" y="304" font-size="24" font-weight="700" fill="#f0f5fc">Keep a sourced lesson</text>
<text x="456" y="345" font-size="19" font-weight="400" fill="#b3c3d9">Retain the quote and</text>
<text x="456" y="373.5" font-size="19" font-weight="400" fill="#b3c3d9">conditions</text>
<text x="456" y="411.0" font-size="18" font-weight="400" fill="#a8bad3">Your usual agent</text>
<text x="456" y="438.0" font-size="18" font-weight="400" fill="#a8bad3">organizes them</text>
<path d="M 774 324 H 808" fill="none" stroke="#7d93af" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="816" y="216" width="336" height="260" rx="16" fill="#152236" stroke="#2b405b"/>
<text x="840" y="259" font-size="20" font-weight="700" fill="#8db8f4">03</text>
<text x="840" y="304" font-size="24" font-weight="700" fill="#f0f5fc">Use it next time</text>
<text x="840" y="345" font-size="19" font-weight="400" fill="#b3c3d9">Check the whole</text>
<text x="840" y="373.5" font-size="19" font-weight="400" fill="#b3c3d9">instructions</text>
<text x="840" y="411.0" font-size="18" font-weight="400" fill="#a8bad3">Reflect on the action</text>
<text x="840" y="438.0" font-size="18" font-weight="400" fill="#a8bad3">and result</text>
<path d="M 984 484 V 530 H 600 V 484" fill="none" stroke="#7d93af" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620" y="560" font-size="18" font-weight="400" fill="#83d8b0">Reflect using observed results</text>
<text x="48" y="608" font-size="19" font-weight="400" fill="#a8bad3">AI handles routine assessment. People check random samples and undecided cases.</text>
</svg>
