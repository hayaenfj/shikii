<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="-apple-system, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 14; }
      .box.asset { fill: #172554; stroke: #3b82f6; }
      .box.wiki { fill: #052e16; stroke: #22c55e; }
      .box.human { fill: #3b2a05; stroke: #f59e0b; }
      .box.model { fill: #1f2937; stroke: #64748b; stroke-dasharray: 6 4; }
      .t { fill: #e2e8f0; font-size: 15px; }
      .h { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .k { fill: #94a3b8; font-size: 12.5px; }
      .ac { fill: #fbbf24; font-size: 13px; font-weight: 600; }
      .gr { fill: #86efac; font-size: 13px; font-weight: 600; }
      .bl { fill: #93c5fd; font-size: 13px; font-weight: 600; }
      .flow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flowA { stroke: #fbbf24; stroke-width: 2.5; fill: none; marker-end: url(#arrowAmber); }
      .pill { fill: #0f172a; stroke: #475569; stroke-width: 1; rx: 999; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="48" class="h" font-size="26">shikii の構造</text>
  <text x="40" y="74" class="k" font-size="14">問いと正解は資産。モデルは使い捨て。知識は検証できる主張として wiki に溜まり、測るたびに自分で育つ。</text>

  <!-- 人 -->
  <rect x="40" y="100" width="1120" height="86" class="box human"/>
  <text x="60" y="130" class="ac" font-size="15">人がすること（この 3 つだけ）</text>
  <rect x="60" y="144" width="300" height="30" class="pill"/>
  <text x="76" y="164" class="t">意図を書く（spec と wiki の細則）</text>
  <rect x="380" y="144" width="340" height="30" class="pill"/>
  <text x="396" y="164" class="t">抜き取りの正解に答える（迷い + act の 20 件に 1 件）</text>
  <rect x="740" y="144" width="400" height="30" class="pill"/>
  <text x="756" y="164" class="t">主張の意味を確かめる（下書きを一般化し、確か / 却下を決める）</text>

  <!-- 資産 -->
  <rect x="40" y="226" width="330" height="300" class="box asset"/>
  <text x="60" y="256" class="bl" font-size="15">資産（モデルを替えても残る）</text>
  <text x="60" y="290" class="t">decisions/  問い</text>
  <text x="76" y="312" class="k">文言・選択肢・並べ方・配置・分解・文脈</text>
  <text x="76" y="330" class="k">指紋 = 聞き方 1 つにつき 1 本の線</text>
  <text x="60" y="366" class="t">.shikii/  正解の貯金</text>
  <text x="76" y="388" class="k">系譜つき: 人の正解 ＞ 機械の正解（審判・上の段）</text>
  <text x="76" y="406" class="k">本文と一緒に残り、文言やモデルが変わると聞き直す</text>
  <text x="60" y="442" class="t">領収書</text>
  <text x="76" y="464" class="k">act の判定ごとに: どの線を、いつ、何件の正解で。</text>
  <text x="76" y="482" class="k">そのうち人の分、人が確かめた act の数と精度</text>
  <text x="60" y="512" class="k" font-style="italic">「95% の確信」ではなく「人が検査した 48 件で精度 0.96」</text>

  <!-- 育つ輪 -->
  <rect x="400" y="226" width="430" height="300" class="box"/>
  <text x="420" y="256" class="t" font-weight="700">機械が育てる輪</text>
  <!-- nodes -->
  <g>
    <rect x="430" y="280" width="150" height="44" class="pill" fill="#0f172a"/>
    <text x="445" y="298" class="t" font-size="14">decide</text>
    <text x="445" y="315" class="k">帯 act / ask / discard</text>
    <rect x="650" y="280" width="160" height="44" class="pill"/>
    <text x="665" y="298" class="t" font-size="14">serve  答え合わせ</text>
    <text x="665" y="315" class="k">迷い → 人、抜き取り</text>
    <rect x="650" y="358" width="160" height="44" class="pill"/>
    <text x="665" y="376" class="t" font-size="14">calibrate  線</text>
    <text x="665" y="393" class="k">指紋 × モデルごと、人の正解で</text>
    <rect x="430" y="358" width="150" height="44" class="pill"/>
    <text x="445" y="376" class="t" font-size="14">tune  聞き方を測る</text>
    <text x="445" y="393" class="k">holdout + 符号検定 + 人の確認</text>
    <rect x="430" y="440" width="150" height="44" class="pill"/>
    <text x="445" y="458" class="t" font-size="14">段階</text>
    <text x="445" y="475" class="k">最小 → 文脈 → 人</text>
    <rect x="650" y="440" width="160" height="44" class="pill"/>
    <text x="665" y="458" class="t" font-size="14">judge  審判</text>
    <text x="665" y="475" class="k">人との一致率 ≥ act の時だけ</text>
  </g>
  <!-- arrows in the loop -->
  <path d="M 580 302 L 648 302" class="flow"/>
  <path d="M 730 324 L 730 356" class="flow"/>
  <path d="M 648 380 L 582 380" class="flow"/>
  <path d="M 505 358 L 505 326" class="flow"/>
  <path d="M 505 402 L 505 438" class="flow"/>
  <path d="M 730 402 L 730 438" class="flow"/>
  <path d="M 648 462 L 582 462" class="flow"/>
  <text x="596" y="297" class="k">迷い・抜き取り</text>
  <text x="596" y="508" class="k">審判も迷えば人へ</text>

  <!-- wiki -->
  <rect x="860" y="226" width="300" height="300" class="box wiki"/>
  <text x="880" y="256" class="gr" font-size="15">検証できる wiki（知識）</text>
  <text x="880" y="290" class="t">主張 = claim</text>
  <text x="896" y="310" class="k">+ 効く範囲 applies_to</text>
  <text x="896" y="328" class="k">+ 証拠 evidence（run ごと、人の正解の数つき）</text>
  <text x="896" y="346" class="k">+ 再検証の手順 retest（spec、候補 vs 候補）</text>
  <text x="880" y="382" class="t">tune が勝者を下書きに起草</text>
  <text x="880" y="404" class="t">別のモデルの run が証拠を足す</text>
  <text x="880" y="426" class="t">wiki verify が今のモデルで測り直す</text>
  <text x="880" y="462" class="gr">独立したモデル 2 つが支持 → confirmable</text>
  <text x="880" y="484" class="k">状態（tentative / confirmed / rejected）を変えるのは人だけ</text>
  <text x="880" y="512" class="k" font-style="italic">別の人が自分のモデルで回した結果も証拠になる</text>

  <!-- cross arrows -->
  <path d="M 370 380 L 398 380" class="flowA"/>
  <text x="372" y="372" class="k" font-size="11">読む</text>
  <path d="M 830 380 L 858 380" class="flowA"/>
  <text x="828" y="372" class="k" font-size="11">起草・証拠</text>
  <path d="M 1010 226 C 1010 200, 760 200, 745 186" class="flowA"/>
  <text x="900" y="212" class="k" font-size="11">確かめる</text>
  <path d="M 205 226 C 205 200, 190 200, 200 186" class="flowA"/>
  <text x="212" y="212" class="k" font-size="11">意図・正解</text>

  <!-- models -->
  <rect x="40" y="566" width="1120" height="110" class="box model"/>
  <text x="60" y="596" class="k" font-size="15" fill="#cbd5e1" font-weight="700">モデル（使い捨て。替えたら calibrate が貯金を聞き直すだけ、人の手は 0）</text>
  <rect x="60" y="616" width="190" height="34" class="pill"/>
  <text x="76" y="638" class="t" font-size="14">決定モデル（Kev-4B …）</text>
  <rect x="270" y="616" width="320" height="34" class="pill"/>
  <text x="286" y="638" class="t" font-size="14">普通のチャット用モデル + shikii-readout（配置）</text>
  <rect x="610" y="616" width="230" height="34" class="pill"/>
  <text x="626" y="638" class="t" font-size="14">ホスト版（鍵は環境変数だけ）</text>
  <rect x="860" y="616" width="280" height="34" class="pill"/>
  <text x="876" y="638" class="t" font-size="14">審判は別の大きいモデル（同じ口）</text>
  <text x="60" y="668" class="k">共通の口 POST /v1/systemone。pii: true と本番を読んだ本文は手元のモデルだけ。</text>
  <path d="M 505 566 L 505 528" class="flow"/>
  <path d="M 730 566 L 730 528" class="flow"/>

  <!-- footer -->
  <text x="40" y="704" class="k" font-size="12">docs/architecture.md の 4 つの柱: 検証できる wiki / 問いと正解は資産 / 信頼の負担（線・抜き取り・領収書・審判）/ 段階は制約付き最適化</text>
</svg>
