# claude-jev の prompt-intent(依頼が変更の依頼か)を spec で表現し直したもの。
id: prompt-intent
version: 1
type: choice

question: |
  What is the user asking for in this message to a coding assistant?

options:
  - id: change_request
    description: Asks for a change to code, configuration or documents in the repository
  - id: question
    description: Asks for an explanation, investigation or opinion; no change is requested
  - id: review
    description: Asks for an evaluation of existing changes or code
  - id: operation
    description: Asks to run, commit, deploy or otherwise operate something without changing code
  - id: other
    description: None of the above

state:
  template: |
    {{ message }}
  required: [message]
  # 迷った時(ask、多択ではどの選択肢にも届かない discard も)だけ: 直前のアシスタントの発言を足して聞き直す(呼ぶ側が previous を渡した時だけ。別の指紋・別の線)
  context: |
    Previous assistant turn:
    {{ previous }}

    User's message:
    {{ message }}

policy:
  send_to: [hosted, local]
  pii: false                  # 本文に個人情報は入らない(hosted にも送れる)

thresholds:
  act: 0.75
  ask: 0.60

eval:
  labeled: testdata/prompt-intent-labeled.json
  min_n: 50
# 画面の表示用の訳(モデルには送らない。較正の鍵にも入らない)
display:
  ja:
    title: 依頼の種類(v1 の文言)
    question: 利用者はコーディングアシスタントに何を求めていますか？
    options:
      change_request: 変更の依頼
      question: 質問・調査
      review: レビュー
      operation: 操作(実行・コミットなど)
      other: 依頼ではない
