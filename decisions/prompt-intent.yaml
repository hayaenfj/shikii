# claude-jev's prompt-intent (is the request a change request?) re-expressed as a spec.
id: prompt-intent
version: 1
type: choice

question: |
  What is the user asking for in this message to a coding assistant?

options:
  - id: change_request
    description: Asks for a change to code, configuration or documents in the repository
  - id: question
    description: Asks for an explanation, investigation or opinion; no change is requested
  - id: review
    description: Asks for an evaluation of existing changes or code
  - id: operation
    description: Asks to run, commit, deploy or otherwise operate something without changing code
  - id: other
    description: None of the above

state:
  template: |
    {{ message }}
  required: [message]
  # Only when unsure (ask, and for multiple choice also discard, where no option is reached): ask again with the assistant's previous message added (only when the caller passes previous; a separate hash and a separate line)
  context: |
    Previous assistant turn:
    {{ previous }}

    User's message:
    {{ message }}

policy:
  send_to: [hosted, local]
  pii: false                  # the text contains no personal data (it can go to hosted too)

thresholds:
  act: 0.75
  ask: 0.60

eval:
  labeled: testdata/prompt-intent-labeled.json
  min_n: 50
# Translation shown on the page (not sent to the model, not part of the calibration key)
display:
  ja:
    title: 依頼の種類(v1 の文言)
    question: 利用者は AI に何を求めていますか？
    options:
      change_request: 変更の依頼
      question: 質問・調査
      review: レビュー
      operation: 操作(実行・コミットなど)
      other: 依頼ではない
