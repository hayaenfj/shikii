# Same-inquiry decision: are two inquiries about the same case (the same order, the same account problem, or one following up the other)? An example of yes/no (noul).
# The calibration block is generated by `shikii calibrate --write`.
id: same-inquiry
version: 1
type: noul
question: |
  Are these two customer inquiries about the same matter - the same order, the same account problem,
  or one a follow-up to the other - so that they should be handled as one ticket?
  Answer "no" if they are merely the same kind of problem from different cases.
state:
  template: |
    Inquiry 1: {{ inquiry1 }}

    Inquiry 2: {{ inquiry2 }}
  required: [inquiry1, inquiry2]
policy:
  send_to: [local, hosted]
  pii: true                   # the text may contain personal data → not sent to an outside AI (hosted). The text stays in the local records
thresholds:
  act: 0.70
  ask: 0.50
eval:
  # 32 pairs for calibration (made up, in Japanese): 12 same case, 12 different cases, 8 same kind of problem but different cases (borderline; false with weight 0.5)
  labeled: testdata/same-inquiry-labeled.json
  min_n: 20
# The calibration block is generated by `shikii calibrate --write`. Do not write it by hand.
calibration:
  - model: ggml-org/Kev-4B-GGUF:Q4_K_M
    spec_hash: b5cc9f9cb1f2e4f4
    method: platt
    bias: -0.38879812759568777
    temperature: 0.7707934390161127
    precision_at_act: 1
    fitted_on: testdata/same-inquiry-labeled.json
    "n": 32
    brier: 0.016506640562992073
    ece: 0.09140828543149455
    fitted_at: "2026-10-17"
  - model: ternary-bonsai-27b-q2g64+state-last
    spec_hash: b5cc9f9cb1f2e4f4
    method: platt
    bias: -1.0829784801021145
    temperature: 1.0378293608578189
    precision_at_act: 1
    fitted_on: testdata/same-inquiry-labeled.json
    "n": 32
    brier: 0.017144495793551505
    ece: 0.09122244487982892
    fitted_at: "2026-10-17"
# Translation shown on the page (not sent to the model, not part of the calibration key)
display:
  ja:
    title: 問い合わせの同一判定
    question: この 2 件の問い合わせは同じ案件ですか？
    options:
      "yes": 同じ案件
      "no": 別の案件
