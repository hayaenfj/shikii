# An example of the score type: same-issue's yes/no turned into a 5-step ordinal scale. The expected value Σ(level × p) can fall between levels.
id: relatedness-level
version: 2
type: score

question: |
  How strongly are these two bug reports connected?

levels:
  - Unrelated - different defects that only share a product or vocabulary
  - Same area - same screen, feature or technology, no concrete link
  - Circumstantial link - shared component, symptom or timing, but no confirmed common cause
  - Directly connected - same root cause, or one a regression or side effect of the other
  - Same defect - a duplicate report of the very same bug

state:
  template: |
    Report 1: {{ report1 }}

    Report 2: {{ report2 }}
  required: [report1, report2]

policy:
  send_to: [local]
  pii: true                   # the text may contain personal data → not sent to an outside AI (hosted). The text stays in the local records

thresholds:
  act: 0.75
  ask: 0.50
  level: 3    # the band uses P(level ≥ 3 = Directly connected), not the top level's probability (it splits across neighboring levels)

eval:
  min_n: 20
# Translation shown on the page (not sent to the model, not part of the calibration key)
display:
  ja:
    title: 関連の強さ(5 段階)
    question: この 2 つの不具合報告はどれくらい関係がありますか？
    levels:
      - 無関係
      - 同じ領域(同じ画面や機能だが、つながりは無い)
      - 状況証拠(部品・症状・時期が重なるが、共通の原因は未確認)
      - 直接の関係(同じ原因、または一方が他方の回帰や副作用)
      - 同一の不具合(重複報告)
