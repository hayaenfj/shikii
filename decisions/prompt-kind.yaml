# The decision used by the Claude Code hook (`shikii hook user-prompt-submit`): what will the AI that receives this request end up doing?
# The truth is set automatically from the outcome: if the working tree's hash changed by the next request (or the end of the turn if none), edit; if not, !edit (a partial label, weight 0.7).
# Until a line can be drawn, the hook outputs nothing (it only records). The original file is integrations/claude-code/specs/prompt-kind.yaml.
id: prompt-kind
version: 1
type: choice

question: |
  What will the coding agent most likely end up doing in response to `request`?

options:
  - id: edit
    description: editing, adding, fixing or deleting files in the repository (code, docs, config, tests)
  - id: explain
    description: answering a question or explaining something, without touching files
  - id: investigate
    description: researching or reading code/web to report findings or options, without editing
  - id: run
    description: running commands, tests, or checking a live system and reporting the result, without editing
  - id: decide
    description: the user is replying to a proposal or choosing between options the agent offered

state:
  template: |
    request: {{ request }}
  required: [request]
  # Only when unsure: ask again with the assistant's previous message (saved by the Stop hook) added (a separate hash and a separate line). Short replies ("yes please", "go ahead") are settled this way
  context: |
    previous assistant turn: {{ previous }}
    request: {{ request }}

policy:
  send_to: [local]    # the request text is not sent outside
  pii: true                   # the text may contain personal data → not sent to an outside AI (hosted). The text stays in the local records

thresholds:
  act: 0.75
  ask: 0.60

eval:
  min_n: 50
# Translation shown on the page (not sent to the model, not part of the calibration key)
display:
  ja:
    title: 依頼の種類
    question: この依頼を受けた AI は、結局どんな作業をすることになりそうか？
    options:
      edit: ファイルを変える
      explain: 説明する(ファイルは触らない)
      investigate: 調べて報告する
      run: 実行して結果を報告する
      decide: 提案への返事・選択
