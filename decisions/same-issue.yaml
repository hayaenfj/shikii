# Duplicate detection for bug reports: are two reports about the same bug? An example of yes/no (noul). The calibration block is generated by `shikii calibrate --write`.
id: same-issue
version: 1
type: noul
question: |
  Do these two bug reports describe the same underlying defect
  (one is a duplicate of the other, or both are symptoms of the same root cause)?
  Answer "no" if they merely concern the same screen, feature or technology.
state:
  template: |
    Report 1: {{ report1 }}

    Report 2: {{ report2 }}
  required: [report1, report2]
policy:
  send_to: [local, hosted]
  pii: true                   # the text may contain personal data → not sent to an outside AI (hosted). The text stays in the local records
thresholds:
  act: 0.70
  ask: 0.50
eval:
  # 32 pairs for calibration (made up, in Japanese): 12 same bug, 12 different bugs, 8 same screen or feature but different bugs (borderline; false with weight 0.5)
  labeled: testdata/same-issue-labeled.json
  min_n: 20
# The calibration block is generated by `shikii calibrate --write`. Do not write it by hand.
calibration:
  - model: ggml-org/Kev-4B-GGUF:Q4_K_M
    spec_hash: 39e5d9072ae0c8c2
    method: platt
    bias: -0.40408618678950053
    temperature: 0.8737206997496267
    precision_at_act: 1
    fitted_on: testdata/same-issue-labeled.json
    "n": 32
    brier: 0.03135395650200396
    ece: 0.09488364359184301
    fitted_at: "2026-10-17"
  - model: ternary-bonsai-27b-q2g64+state-last
    spec_hash: 39e5d9072ae0c8c2
    method: platt
    bias: -1.0298694759988787
    temperature: 0.8588824690797229
    precision_at_act: 1
    fitted_on: testdata/same-issue-labeled.json
    "n": 32
    brier: 0.01986838302669632
    ece: 0.0971489899711626
    fitted_at: "2026-10-17"
# Translation shown on the page (not sent to the model, not part of the calibration key)
display:
  ja:
    title: 不具合報告の重複判定
    question: この 2 つの不具合報告は同じ不具合ですか？
    options:
      "yes": 同じ不具合
      "no": 別の不具合
# Candidate wordings (2026-10-18): candidates that differ only in layout. Does it help when a plain chat model is read through the readout (13 points on prompt-intent)?
variants:
  - name: plain
    layout: plain
  # Retest of the wiki pattern noul-define-yes-before-contrast: define yes first and put the contrast after it with "as opposed to" (the current text ends with a negative instruction)
  - name: yes-first
    question: |
      Do these two bug reports describe the same underlying defect - one is a duplicate of the other,
      or both are symptoms of the same root cause - as opposed to merely concerning the same screen, feature or technology?
