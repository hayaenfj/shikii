# Wording experiment for prompt-intent (2026-10-16). In v1, 19 of the 21/66 errors were absorbed by other.
# Calibration does not fix ranking errors, so the option descriptions are made concrete and other is limited to "not a request".
# Raw accuracy compared with v1 on the same testdata/prompt-intent-labeled.json: top-1 0.682 → 0.903.
id: prompt-intent
version: 2
type: choice
question: |
  The state is a message a user sent to a coding assistant. What is the user asking the assistant to do?
  Short messages like "fix it" or "why?" are still requests; pick the closest request type.
options:
  - id: change_request
    description: Change something in the repository - edit, fix, add, remove, rename, refactor, write tests or docs. Includes terse commands like "fix the typo" or "直して".
  - id: question
    description: Explain, investigate, compare or give an opinion, without changing anything. Includes "why", "what does this do", "where is", "調べて".
  - id: review
    description: Evaluate changes or code that already exist - review a diff or PR, check for problems, rate quality.
  - id: operation
    description: Run or operate something without editing code - run tests, build, commit, push, deploy, restart, install, show logs.
  - id: other
    description: Not a request at all - greetings, thanks, acknowledgements ("ok", "了解"), small talk, or ending the session.
state:
  template: |
    {{ message }}
  required: [message]
policy:
  send_to: [hosted, local]
  pii: false # the text contains no personal data (it can go to hosted too)
thresholds:
  act: 0.75
  ask: 0.60
eval:
  labeled: testdata/prompt-intent-labeled.json
  min_n: 50
# The calibration block is generated by `shikii calibrate --write`. Do not write it by hand.
calibration:
  - model: ggml-org/Kev-4B-GGUF:Q4_K_M
    spec_hash: df1367887c4970a7
    method: vector
    temperature: 0.44894918617400287
    biases:
      change_request: -0.36401015048582736
      operation: 0.587543414864858
      other: -0.5348494885571329
      question: -0.06151837617222262
      review: 0.37283460035032495
    precision_at_act: 0.9629629629629629
    fitted_on: testdata/prompt-intent-labeled.json
    "n": 62
    brier: 0.046888433844563024
    ece: 0.04970909658127454
    fitted_at: "2026-10-16"
  - model: ternary-bonsai-2-27b
    spec_hash: df1367887c4970a7
    method: vector
    temperature: 0.6476247912548807
    biases:
      change_request: -0.9561972502792933
      operation: -0.5266943867505005
      other: 0.6100832685021256
      question: -0.3029058663577843
      review: 1.1757142348854523
    precision_at_act: 0.9824561403508771
    fitted_on: testdata/prompt-intent-labeled.json
    "n": 62
    brier: 0.01564234238521169
    ece: 0.04583037754973626
    fitted_at: "2026-10-17"
# Translation shown on the page (not sent to the model, not part of the calibration key)
display:
  ja:
    title: 依頼の種類
    question: 利用者は AI に何を求めていますか？
    options:
      change_request: 変更の依頼
      question: 質問・調査
      review: レビュー
      operation: 操作(実行・コミットなど)
      other: 依頼ではない
# Candidate wordings (`shikii tune` scores them against the saved truths; not part of the key)
variants:
  # Layout candidates (2026-10-18): with the same weights, the layout alone moved 13 points (docs/bench.md). plain has no system message, uses "- id: description" and reads the first token of the id
  - name: plain
    layout: plain
  - name: state-first
    layout: state-first   # old layout. Used to retest the wiki's state-last-for-recurrent-readout (current is state-last)
  - name: plain-shorter
    layout: plain
    question: |
      The input is a message a user sent to a coding assistant. Which kind of request is it?
      Short messages like "fix it" or "why?" are still requests; pick the closest request type.
  - name: shorter-question
    question: |
      The state is a message a user sent to a coding assistant. Which kind of request is it?
  - name: other-tight
    options:
      other: Not a request at all - greetings, thanks, acknowledgements ("ok", "了解"), small talk, goodbye. Anything that asks for work, however short, is a request and never other.
  - name: tighten-review-vs-operation
    question: The state is a message a user sent to a coding assistant. What is the user asking the assistant to do? Short messages like "fix it" or "why?" are still requests; pick the closest request type.
    options:
      review: Evaluate changes or code that already exist - review a diff or PR, check for problems, rate quality, or ask for a correctness check (e.g., "Does this look correct?").
  - name: clarify-review-purpose
    question: The state is a message a user sent to a coding assistant. What is the user asking the assistant to do? Short messages like "fix it" or "why?" are still requests; pick the closest request type.
    options:
      review: Evaluate changes or code that already exist - review a diff or PR, check for problems, rate quality, or verify correctness (e.g., "Does this implementation look correct?").
  - name: add-review-example
    question: The state is a message a user sent to a coding assistant. What is the user asking the assistant to do? Short messages like "fix it" or "why?" are still requests; pick the closest request type.
    options:
      review: Evaluate changes or code that already exist - review a diff or PR, check for problems, rate quality. Includes correctness checks like "Does this look correct?".
  - name: two-step
    steps:
      - ask: Is this message a request (something the assistant should do or answer), as opposed to a greeting, thanks, an acknowledgement or small talk?
        no: other
      - ask: Does the message ask to change something in the repository (edit, fix, add, remove, rename, refactor, write tests or docs)? Terse commands like "fix the typo" count.
        yes: change_request
      - ask: Does the message ask to run or operate something without editing code (run tests, build, commit, push, deploy, restart, install, show logs)?
        yes: operation
      - ask: Does the message ask to evaluate code or changes that already exist (review a diff or PR, check for problems, rate quality), rather than to explain or investigate?
        yes: review
        no: question
