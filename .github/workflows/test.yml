name: test
on:
  push:
    branches: [main]   # タグの push では走らせない(同じコミットの CI を 2 回回さない)
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 画面(web/、Svelte): 元から組み直して、commit 済みの web/dist と一致することを確かめる
      # (手で dist を直したり、元を直して make web を忘れたら落ちる)。辞書の鍵の揃いも見る
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd web && npm ci && npm run check && npm run build
      - run: git add -N web/dist && git diff --exit-code -- web/dist
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/shikii ./cmd/shikii && go build -o bin/fake-systemone ./cmd/fake-systemone && go build -o bin/shikii-readout ./cmd/shikii-readout
      # 契約の検査: spec の較正ブロックが今の文言と合い、act での precision が足りているか。
      # 裏付けのラベルは testdata/store/labels/(較正を書いた時のものを写した。入力はハッシュだけ)
      - run: bin/shikii check --store testdata/store decisions/*.yaml
      # Docker の画像が組めるか(docker compose up の入り口が壊れていないか)
      - run: docker build -t shikii:ci .
      # 偽モデルで輪が一周するか
      - run: scripts/demo.sh > /tmp/demo.log && tail -5 /tmp/demo.log
      # README: 言語切替行と docs/readme/ の対応、各言語版の先頭行、相対リンクの実在
      - run: scripts/check-readme.sh
      # skill(エージェント向けの作法)の前書きと参照の実在
      - run: scripts/check-skill.sh
