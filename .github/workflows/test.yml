name: test
on:
  push:
    branches: [main]   # do not run on tag pushes (do not run CI twice for the same commit)
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # once a week (Monday), only the security job. Learn about vulnerabilities found after release without waiting for the next push
# Read only (no step needs write access). When a new push arrives on the same branch, stop the older run (CI cost)
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Page (web/, Svelte): rebuild from source and check that it matches the committed web/dist
      # (fails if dist was edited by hand, or the source was changed and make web was forgotten). Also checks that the dictionary keys match
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run check && npm run build
      - run: git add -N web/dist && git diff --exit-code -- web/dist
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Split the cmd/shikii tests into groups and run them at the same time in separate processes (they replace global values, so they cannot run side by side in one process)
      - run: scripts/go-test.sh
        timeout-minutes: 30
      - run: go build -o bin/shikii ./cmd/shikii && go build -o bin/fake-systemone ./cmd/fake-systemone && go build -o bin/shikii-readout ./cmd/shikii-readout
      # Contract check: the spec's calibration block matches the current wording, and precision at act is high enough.
      # The backing labels are in testdata/store/labels/ (copied from when the calibration was written; the inputs are only hashes)
      - run: bin/shikii check --store testdata/store decisions/*.yaml
      # Whether the Docker image builds (whether the docker compose up entry point is broken)
      - run: docker build -t shikii:ci .
      # Whether the loop goes all the way around with the fake model
      - run: scripts/demo.sh > /tmp/demo.log && tail -5 /tmp/demo.log
      # README: the language switcher line matches docs/readme/, the first line of each language version, relative links exist
      - run: scripts/check-readme.sh
      # skill (working rules for agents): the front matter and that its references exist
      - run: scripts/check-skill.sh
      # What ships is in English: Japanese only in the Japanese document pairs, ja.js, testdata and scripts/japanese-allowlist.txt
      - run: python3 scripts/test-check-english.py && python3 scripts/check-english.py
  # Leaked secrets and known vulnerabilities. Runs side by side with the go job
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks looks at the whole history too
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # gitleaks: the official Action needs a key for organization repositories, so use the binary directly with its version and hash pinned.
      # Write false positives to .gitleaksignore by Fingerprint
      - run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
      # govulncheck: of the known vulnerabilities in the dependencies and the standard library, report only those actually called. There is no way to exclude them, so
      # when one shows up, raise go.mod's toolchain or the dependency to a fixed version (if there is no fixed version, remove this step only for that time and give the reason in the commit)
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
