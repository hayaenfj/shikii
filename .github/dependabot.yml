# Dependabot version updates for everything this repository pins.
# dependabot_test.go fails when a go.mod, Dockerfile, package.json with dependencies or workflow is not listed here.
#
# CI cost: one pull request per ecosystem per week (grouped), and a 7-day cooldown so a version published
# minutes ago (the usual window for a hijacked release) is not proposed. Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]

  # web/ (Svelte + Tailwind CSS). The CI job "go" rebuilds web/dist and fails if it differs from the committed one,
  # so a Dependabot pull request that changes the bundle needs `make web` committed on its branch before merging.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      web-dependencies:
        patterns: ["*"]

  # .github/workflows/*.yml and the root action.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in the Dockerfile. The Node image follows the even-numbered LTS lines by hand (CI's node-version and the
  # Makefile say the same number), so Dependabot must not propose a new major such as an odd-numbered release.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
