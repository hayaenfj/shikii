# docker compose up  → answer-checking page at http://127.0.0.1:8095
# Three containers: llama (the official llama.cpp server; fetches Ternary-Bonsai-27B Q2_g64 on first start, about 7.6 GB),
# readout (shikii-readout; reads token probabilities from an ordinary GGUF and answers in decision-model form; passes a decision model through as is), and shikii (this repo's image).
# The project root (this folder) is mounted at /work, so the host's .shikii/ (decision specs, knowledge, records and truths) is used as is, and the knowledge it gains is kept.
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-hf", "prism-ml/Ternary-Bonsai-27B-gguf", "--hff", "Ternary-Bonsai-27B-Q2_g64.gguf", "--host", "0.0.0.0", "--port", "8086", "-fa", "on", "-ctk", "q8_0", "-ctv", "q8_0", "-np", "1"]
    volumes:
      - hf-cache:/root/.cache/llama.cpp
  readout:
    build: .
    entrypoint: ["shikii-readout", "--upstream", "http://llama:8086", "--port", "8080"]
    depends_on: [llama]   # readout itself waits for llama's /health
  shikii:
    build: .
    # On Linux a bind mount keeps the host's owner. The image does not run as root, so run it as the host's uid/gid so it can write to .shikii/
    user: "${UID:-1000}:${GID:-1000}"
    depends_on: [readout]   # No healthcheck (to avoid relying on outside commands). shikii itself waits for readout's /health
    volumes:
      - .:/work
    ports:
      - "127.0.0.1:8095:8095"
    # Pass keys only through environment variables (never in files). To also use hosted: environment: [TYPESAFE_API_KEY] (DECISIONS_API_KEY is read too)
volumes:
  hf-cache:
# To use another model, only change llama's command (for a local GGUF, -m <file>). readout also passes a trained decision model's answers through as is, so nothing else changes.
# To use TypeSafe's Jev instead of running a local model, remove llama and readout and give shikii environment: [TYPESAFE_API_KEY].
