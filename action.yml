# GitHub Action: runs `shikii check` on a PR (fails lines whose wording changed, hand-written lines, and lines below their precision).
# Usage (in the workflow of the repository that uses it):
#   - uses: hayaenfj/shikii@main
#     with:
#       specs: .shikii/decisions/*.yaml      # specs to check
#       store: .shikii               # where the truths live (if kept in the repository). Otherwise a folder with truths, like testdata/store
name: shikii check
description: Fail the PR when a decision spec's calibration is stale, hand-written or below its act precision
inputs:
  specs:
    description: spec files to check (glob)
    required: false
    default: .shikii/decisions/*.yaml
  store:
    description: directory with records and truths
    required: false
    default: .shikii
  version:
    description: shikii ref to build (branch, tag or commit)
    required: false
    default: main
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.27"
    - name: build shikii
      shell: bash
      run: |
        set -eu
        tmp="$(mktemp -d)"
        git clone --depth 1 --branch "${{ inputs.version }}" https://github.com/hayaenfj/shikii "$tmp/shikii"
        (cd "$tmp/shikii" && go build -o "$RUNNER_TEMP/shikii" ./cmd/shikii)
    - name: shikii check
      shell: bash
      run: |
        set -eu
        "$RUNNER_TEMP/shikii" check --store "${{ inputs.store }}" ${{ inputs.specs }}
