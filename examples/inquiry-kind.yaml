# Example (business): the kind of inquiry (5 choices). Used to route incoming inquiries. Starts with no calibration block.
id: inquiry-kind
version: 1
type: choice

question: |
  The state is a message a customer sent to a support desk. What is the customer asking for?
  Pick the closest kind even when the message is short or mixes several things.

options:
  - id: order_status
    description: Where is my order, delivery delay, tracking, address change for an order already placed.
  - id: billing
    description: Charges, invoices, receipts, refunds, double billing, plan or subscription changes.
  - id: account_access
    description: Cannot log in, password reset, two-factor codes, account deletion, data export.
  - id: product_question
    description: How a product or feature works, sizes, compatibility, availability, shipping regions - before or after buying.
  - id: complaint
    description: Damaged or wrong item, service quality, unwanted emails, a request to escalate.

state:
  template: |
    {{ message }}
  required: [message]

policy:
  send_to: [local]            # inquiry text may contain personal data. Send it only to the local AI
  pii: true                   # the text may contain personal data → not sent to an outside AI (hosted). The text stays in the local records

thresholds:
  act: 0.80                   # route automatically. Only when calibrated
  ask: 0.55                   # show the candidates to a staff member to choose. Below this, into the "other" queue

eval:
  min_n: 50
