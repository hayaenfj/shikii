# Example (robots and drones): should the landing be aborted (yes/no)?
# This example shows "nothing runs automatically until the answers have been checked".
#   act     = abort automatically (climb and hold). Only appears after calibration is written and the precision at act is confirmed
#   ask     = warn the operator and ask for a decision. Without calibration it stops here however high the probability
#   discard = do nothing (continue landing)
#   abstain = input is missing (no sensor summary). No decision was made
# The state holds a summary (text) of the aircraft's telemetry. shikii does not compute the probability; the connected decision model returns it.
# On a real aircraft, put this in a separate layer from the immediate safety systems (altitude and obstacle sensor interrupts). It is not a replacement for them.
id: drone-landing-abort
version: 1
type: noul

question: |
  Given this telemetry summary during final approach, should the landing be aborted now
  (climb and hold) rather than continued? Answer "yes" when continuing is likely unsafe:
  obstacle or person in the landing zone, unstable attitude, drifting position, degraded GPS or wind beyond limits.
  Answer "no" when the approach is nominal or the anomaly is minor and already corrected.

state:
  template: |
    Altitude AGL: {{ altitude_m }} m, descent rate {{ descent_mps }} m/s
    Position error vs pad: {{ position_error_m }} m, drift {{ drift_mps }} m/s
    Wind: {{ wind_mps }} m/s, gusts {{ gust_mps }} m/s
    GPS: {{ gps_status }}; attitude: {{ attitude }}
    Landing zone camera: {{ zone_observation }}
  required: [altitude_m, descent_mps, position_error_m, drift_mps, wind_mps, gust_mps, gps_status, attitude, zone_observation]

policy:
  send_to: [local]            # never sent from the field equipment to an outside API
  pii: false                  # the text contains no personal data (send_to is local only, so it never leaves anyway)

thresholds:
  act: 0.90                   # automatic abort. Set high. Never appears unless calibrated
  ask: 0.40                   # warn the operator. Set low to miss fewer cases

eval:
  min_n: 100                  # truths come from matching recorded landings with whether the operator actually aborted
