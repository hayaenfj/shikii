# Example (legal): do two contract clauses conflict (yes/no)? Used to triage before review. Starts with no calibration block.
# Note: act means "put it in the human review queue as a conflict"; it never changes the contract automatically.
id: clause-conflict
version: 1
type: noul

question: |
  Do these two clauses from the same contract conflict - can a party not comply with both at once,
  or does one override, shorten or void the other?
  Answer "no" if they merely overlap in topic or repeat each other.

state:
  template: |
    Clause A: {{ clause_a }}

    Clause B: {{ clause_b }}
  required: [clause_a, clause_b]

policy:
  send_to: [local]            # contracts never leave this machine
  pii: true                   # the text may contain personal data → not sent to an outside AI (hosted). The text stays in the local records

thresholds:
  act: 0.80                   # queue it for a lawyer's check as a conflict
  ask: 0.50                   # only mark it "needs checking". Below this, do nothing

eval:
  min_n: 40
